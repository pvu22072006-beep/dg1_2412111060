services:
  web:
    build: .
    environment:
      MSSV: "2412111060"
    volumes:
      - ./app/data:/app/app/data
    expose:
      - "5000"

  nginx:
    image: nginx:alpine
    depends_on:
      - web
    ports:
      - "8081:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
